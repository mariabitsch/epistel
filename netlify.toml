# Netlify build contract. The site is fully static: build.py (slice 3)
# parses vendored TEI into JSON and generates dist/. No runtime services.
[build]
  command = "python3 build.py"
  publish = "dist"

# Everything under /assets carries its content hash in its file name
# (sitegen/assets.py), so a URL there can never change meaning: cache it
# forever, no revalidation round-trips. The HTML pages keep Netlify's
# default (revalidate on every request), which is what lets a deploy show
# immediately -- changed assets get new names, and the repointed pages
# carry them. A test holds this header and the hashed names together.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
