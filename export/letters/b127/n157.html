<div class="tei-opener"></div><div class="tei-div" data-type="mainText"><p class="tei-p"><span class="tei-pb" data-n="1r" data-rend="supplied"></span><span class="tei-milestone" data-unit="entry" data-n="45" data-edref="#BogA"></span>Jeg vilde gjerne <span class="tei-app"><span class="tei-lem"><span class="tei-add">lægge</span></span><span class="tei-rdg" hidden><span class="tei-del" data-instant="unknown" data-rendition="#uvis">læggen</span></span></span> en <span class="tei-choice"><span class="tei-abbr">ell.</span><span class="tei-expan" hidden>eller</span></span> anden vellugtende Ting i Æsken; men da jeg ikke har Andet ved Haanden end <span class="tei-ref" data-type="commentary" data-target="kom.xml#b-1968">det medfølgende Brev</span>, saa haaber jeg, at Du vil være tilfreds dermed. </p></div><div class="tei-closer"></div><div class="tei-trailer" data-type="addrOnEnvelope"><span class="tei-l" data-rendition="#ind"><span class="tei-pb" data-n="1v" data-rend="supplied"></span>Til</span><span class="tei-l" data-rend="decoration"> <figure class="tei-figure" data-type="blank"></figure> </span><span class="tei-l" data-rendition="#ind"><span class="tei-ref" data-type="commentary" data-target="kom.xml#b-1969"><span class="tei-choice"><span class="tei-abbr">Frøk.</span><span class="tei-expan" hidden>Frøken</span></span><span class="tei-persName" data-key="Olsen, Regine">Regine Olsen</span></span>.</span></div>
