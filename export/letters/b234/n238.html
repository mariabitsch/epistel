<div class="tei-opener"></div><div class="tei-div" data-type="mainText"><p class="tei-p" data-rendition="#kortind"><span class="tei-milestone" data-unit="entry" data-n="269" data-edref="#BogA"></span><span class="tei-pb" data-n="1r" data-rend="supplied"></span><span class="tei-pb" data-n="362" data-edref="#SKS"></span>Idet jeg <span class="tei-ref" data-type="commentary" data-target="kom.xml#b-2767">takker for »Indøvelserne«</span>, som, idet de øve, med Rette <span class="tei-ref" data-type="commentary" data-target="kom.xml#b-2768">slaae og nedslaae hele den opklinede Stats-, Vane- og Navn-Christendom</span>, fremsender jeg min kjere Ven <span class="tei-ref" data-type="commentary" data-target="kom.xml#b-2769">nærværende Bog</span> med det Ønske, at De maa finde samme Aand i Kamp der.</p></div><div class="tei-closer"><div class="tei-signed"><span class="tei-l" data-rendition="#baglang">Deres gamle Ven</span><span class="tei-l"><span class="tei-placeName"><span class="tei-ref" data-type="commentary" data-target="kom.xml#b-2770">Slagelse</span></span><span class="tei-date" data-when="18501118">18 Nov. 1850</span>.</span><span class="tei-l" data-rendition="#baglang"><span class="tei-ref" data-type="commentary" data-target="kom.xml#b-2771"><span class="tei-persName" data-key="Rudelbach, Andreas Gottlob">A G Rudelbach</span></span>.</span></div></div>
